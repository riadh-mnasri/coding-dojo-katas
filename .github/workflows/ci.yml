name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests des 61 katas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  tdd-history:
    name: Historique TDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: python3 scripts/check_tdd_history.py
